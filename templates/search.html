{% extends "base.html" %}

{% block body %}  
{% if blogs %}
<h3 class="text-warning" style="letter-spacing :2px;">Results for '{{keyword}}'</h3> 
<div class="row mb-2">
{% for post in blogs  %}
<div class="col-md-6">
  <div class="card border-0" >
    <div class="card-body">
      <h3><a href="{%url 'blog' post.slug%}" class='text-dark'>{{post.title}}</a></h3>
      <small class="mb-1 text-muted">{{post.created_at | timesince}} ago | {{post.author}}</small>
      <p class="card-text">{{post.short_description}}</p>
    </div>
  </div>
</div>
{% endfor %}
{% else %}
<h3 class="text-warning" style="letter-spacing :2px;">No Results for '{{keyword}}'</h3> 
{% endif %}
</div>

</div>
{% endblock body %}
